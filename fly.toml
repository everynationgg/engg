# fly.toml app configuration file generated for engg on 2026-04-24T11:59:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'engg'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '10000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
