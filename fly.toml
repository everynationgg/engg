# fly.toml — Fly.io configuration for errant-night API server
# This file is placed in the root to allow "fly deploy" to run directly.

app = 'engg'
primary_region = 'sin'

[build]
  dockerfile = "artifacts/api-server/Dockerfile"
  ignorefile = ".gitignore"

[env]
  NODE_ENV = 'production'
  PORT = '10000'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[http_service.concurrency]
  type = 'connections'
  hard_limit = 250
  soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '15s'
  method = 'GET'
  path = '/health'
  timeout = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
