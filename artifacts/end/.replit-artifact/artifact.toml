kind = "web"
previewPath = "/"
title = "Lockdown Protocol: ENfestation"
version = "1.0.0"
id = "artifacts/lockdown-protocol"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19167

[services.development]
run = "pnpm --filter @workspace/lockdown-protocol run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lockdown-protocol", "run", "build" ]
publicDir = "artifacts/lockdown-protocol/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19167"
BASE_PATH = "/"
